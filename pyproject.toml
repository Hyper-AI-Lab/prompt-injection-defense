[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "containment"
version = "1.5.1"
description = "Production prompt-injection defense kit: labels, policy, broker, ingest, detectors"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Kirill Mitrofanov" }]
keywords = ["prompt-injection", "prompt-injection-defense", "llm-security", "ai-agents", "security", "policy"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/Hyper-AI-Lab/prompt-injection-defense"
Repository = "https://github.com/Hyper-AI-Lab/prompt-injection-defense"
Issues = "https://github.com/Hyper-AI-Lab/prompt-injection-defense/issues"

[project.scripts]
containment = "containment.cli:main"
containment-egress-proxy = "containment.egress_proxy:main"
containment-claude-hook = "containment.adapters.claude_hook:main"
containment-reference-host = "containment.reference_host.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "cryptography>=42",
]
crypto = [
  "cryptography>=42",
]
ml = [
  "transformers>=4.40",
  "torch>=2.0",
]
stackone = [
  "stackone-defender>=0.8",
]
redis = [
  "redis>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/containment"]

[tool.hatch.build.targets.wheel.force-include]
"src/containment/reference_host/fixtures" = "containment/reference_host/fixtures"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/policies",
  "/fixtures",
  "/docs",
  "/LICENSE",
  "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
