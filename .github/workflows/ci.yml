# CI: lint, test, release_gate, pip-audit, CycloneDX SBOM
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Pin versions reasonably (Dependabot will refresh github-actions).
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: System deps (ripgrep for release_gate placeholder scan)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep

      - name: Install package + audit/SBOM tools
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit "cyclonedx-bom>=5"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest

      - name: Release gate
        run: bash scripts/release_gate.sh

      - name: Wheel smoke (built wheel runs outside the checkout)
        run: |
          python -m pip install "build>=1.2"
          python -m build --outdir "$RUNNER_TEMP/dist"
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          wheel-venv/bin/containment eval --suite fixtures
          wheel-venv/bin/containment eval --suite mutations
          wheel-venv/bin/containment-eval-card --suite fixtures --out-dir eval-card
          wheel-venv/bin/containment-reference-host --scenario all

      - name: pip-audit
        run: pip-audit

      - name: CycloneDX SBOM
        run: |
          cyclonedx-py environment -o sbom.cdx.json --of json --pyproject pyproject.toml --mc-type library
          test -s sbom.cdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-cdx-json
          path: sbom.cdx.json
          if-no-files-found: error

  # Optional ML layer: pinned ONNX classifier (hash-verified), mutation eval + tests.
  ml-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package with the [ml] extra
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,ml]"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/containment/models
          key: containment-models-${{ hashFiles('src/containment/detectors/onnx_classifier.py') }}

      - name: Fetch and verify the default model (pinned revision + SHA-256)
        run: containment models fetch hl-small

      - name: Doctor with the ONNX Stage-1 configured
        env:
          CONTAINMENT_STAGE1: onnx
        run: containment doctor --install-only

      - name: Mutation eval (ONNX layered Stage-1)
        env:
          CONTAINMENT_STAGE1: onnx
        run: containment eval --suite mutations

      - name: Detector-layer tests incl. the real model
        run: pytest -q tests/test_detector_layers.py tests/test_mutation_eval.py
